<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipForge</title>
  <style>
    /* Inline and dependency-free on purpose: if the module graph fails to
       load, the stylesheet never arrives either, so this is the only thing
       that can render. Dark to match the app, so a failed boot does not flash
       a white screen. */
    html, body { margin: 0; background: #0a0a0b; color: #e7e7e9; }
    #boot {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    #boot .card {
      max-width: 34rem; width: 100%; text-align: center;
      border: 1px solid #27272a; border-radius: 12px;
      background: #111113; padding: 28px 22px;
    }
    #boot .title { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    #boot .sub { margin: 0; font-size: 13px; line-height: 1.6; color: #a1a1aa; }
    #boot .err {
      margin: 14px 0 0; padding: 10px; border-radius: 8px;
      background: #1c1917; border: 1px solid #44403c; color: #fca5a5;
      font-family: ui-monospace, monospace; font-size: 11px;
      text-align: left; white-space: pre-wrap; word-break: break-word;
      max-height: 40vh; overflow: auto;
    }
    #boot button {
      margin-top: 18px; cursor: pointer; border: 0; border-radius: 8px;
      background: #22c55e; color: #052e16; font-weight: 700;
      font-size: 13px; padding: 10px 18px;
    }
    #boot .spin {
      display: inline-block; width: 13px; height: 13px; margin-right: 8px;
      vertical-align: -2px; border: 2px solid #3f3f46; border-top-color: #22c55e;
      border-radius: 50%; animation: bootspin 0.8s linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }
    /* Once a failure is known, stop implying that progress is happening. */
    #boot.failed .spin { display: none; }
  </style>
</head>

<body>
  <div id="root"></div>

  <!--
    Boot fallback. `#root` is empty until React mounts, so ANY failure before
    that point — a module that 404s, a stale Vite dep chunk, a syntax error in
    a lazily-imported route — used to leave the page pure white with no
    information at all. This renders first, is removed by main.tsx once the
    app actually mounts, and turns that dead white screen into something that
    says what went wrong and offers a reload.
  -->
  <div id="boot">
    <div class="card">
      <p class="title"><span class="spin"></span><span id="boot-title">Starting ClipForge…</span></p>
      <p class="sub" id="boot-sub">Loading the app. This normally takes a few seconds.</p>
      <pre class="err" id="boot-err" hidden></pre>
      <button id="boot-reload" hidden onclick="location.reload()">Reload</button>
    </div>
  </div>

  <script>
    (function () {
      // main.tsx sets this the instant React takes over, which both removes the
      // fallback and tells these handlers there is nothing left to report.
      window.__clipforgeBooted = false;

      function fail(message) {
        if (window.__clipforgeBooted) return;
        var boot = document.getElementById("boot");
        if (!boot) return;
        boot.classList.add("failed");
        document.getElementById("boot-title").textContent = "ClipForge didn't start";
        document.getElementById("boot-sub").textContent =
          "The app's JavaScript failed to load. This is usually a stale page after a " +
          "restart — a reload normally fixes it.";
        var err = document.getElementById("boot-err");
        err.textContent = message;
        err.hidden = false;
        document.getElementById("boot-reload").hidden = false;
      }

      // A <script type="module"> that cannot be fetched or evaluated fires an
      // error event on the element itself, which never reaches window.onerror.
      window.addEventListener(
        "error",
        function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") {
            fail("Failed to load " + (e.target.src || "a module"));
          } else if (e && e.message) {
            fail(e.message);
          }
        },
        true,
      );
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        fail(String((r && r.message) || r || "Unhandled error"));
      });

      // Last resort for a failure that raises no event: if React has still not
      // mounted after this long, say so instead of leaving white on screen.
      setTimeout(function () {
        if (window.__clipforgeBooted) return;
        var root = document.getElementById("root");
        if (root && root.childElementCount > 0) return;
        fail("Timed out after 15s waiting for the app to mount.");
      }, 15000);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
