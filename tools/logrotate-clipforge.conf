// ClipForge disk-hygiene schedule.
//
// This container has NO cron, NO systemd and NO logrotate binaries, so the
// schedules below are provided for the host that runs the app for real:
//
//   sudo cp tools/logrotate-clipforge.conf /etc/logrotate.d/clipforge
//   sudo systemctl enable --now clipforge-disk.timer      (after copying the units)
//
// Inside this container the equivalent work is done in-process:
//   * app/reclaim.housekeeping()  every 5 min  — retention + bucket budget
//   * app/disksweep.nightly()     once per 24 h — the same safe sweep the
//     "Clean up" button calls (bytecode, orphan scratch, /tmp, logs > 20 MB or
//     older than 3 days, pip/yt-dlp/npm caches, bucket-backed model copies)
//   * POST /api/storage/reclaim   on demand      — offload + sweep, per-category MB
//
// NEITHER path touches: .env and key stores, cookies.txt, the job documents
// (data/jobs), data/backups, the venv, node_modules, .git, app/assets (emoji
// PNGs), app/fonts, or anything a running batch is holding.

# --- logrotate: keep 3 days / 20 MB, in data/logs -------------------------
/home/daytona/codebase/data/logs/*.log {
    daily
    size 20M
    rotate 3
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

# --- systemd timer: nightly sweep at 04:15 --------------------------------
# [Unit]
# Description=ClipForge nightly disk cleanup
#
# [Service]
# Type=oneshot
# WorkingDirectory=/home/daytona/codebase
# ExecStart=/home/daytona/codebase/.venv/bin/python tools/disk_cleanup.py
# Nice=19
#
# [Install]
# WantedBy=timers.target
#
# --- clipforge-disk.timer -------------------------------------------------
# [Unit]
# Description=Run ClipForge disk cleanup every night
#
# [Timer]
# OnCalendar=*-*-* 04:15:00
# Persistent=true
#
# [Install]
# WantedBy=timers.target

# --- crontab alternative --------------------------------------------------
# 15 4 * * * cd /home/daytona/codebase && .venv/bin/python tools/disk_cleanup.py >> data/logs/disk_cleanup.log 2>&1
