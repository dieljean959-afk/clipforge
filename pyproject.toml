[project]
name = "clipforge"
version = "1.0.0"
description = "ClipForge — local video → viral clips pipeline (MoneyPrinterTurbo heritage, MIT)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "faster-whisper>=1.1",
  "yt-dlp>=2024.10.22",
  "google-genai>=0.6",
  "pillow>=10.4",
]

[project.optional-dependencies]
# heavy extras installed by start.sh --with-extras (or manually)
gpu = ["ctranslate2>=4.3"]
vad = ["silero-vad>=5.1", "torch>=2.2", "numpy>=1.26"]
reframe = ["mediapipe>=0.10", "opencv-python-headless>=4.9"]
moviepy = ["moviepy>=2.1"]

[project.scripts]
clipforge = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
