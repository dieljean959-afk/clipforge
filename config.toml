# Minimal deploy-safe config.
# Host/port are still resolved from env first (PORT / CLIPFORGE_PORT / HOST / CLIPFORGE_HOST).
# This file only provides safe fallbacks for the parts the app reads when env is absent.

[app]
host = "0.0.0.0"
port = 10000

# ffmpeg required by the video pipeline; set FFMPEG_PATH if it is not on PATH in the container.
# ffmpeg_path = "/usr/bin/ffmpeg"

[hosted]
worker_url = ""
max_source_min = 120
retention_hours = 96
