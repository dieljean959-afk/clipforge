# ClipForge — hosted pipeline configuration (MoneyPrinterTurbo heritage, pruned).
# Secrets are supplied through the platform Keys/API keys tab, never this file.

[app]
host = "127.0.0.1"
port = 8000
# Server working folders — created on boot in the deployment filesystem.
downloads_dir = "downloads"
outputs_dir = "outputs"
data_dir = "data"

[whisper]
# medium is the accuracy default (~1.5GB model; slower/heavier than small on CPU)
# large-v3 (~3GB, best, needs 8GB+ free RAM)
#
# This is the SANDBOX default and is deliberately modest: the hosted worker runs
# on 1 vCPU / 2 GiB, where hostlimits downgrades large-v3/medium to small to
# fit. A GPU worker host should NOT inherit this value — override it there with
# CLIPFORGE_WHISPER_MODEL=large-v3, which wins over this file.
model = "medium"

# Transcription backend. "auto" prefers WhisperX (github.com/m-bain/whisperX —
# batched CTranslate2 decoding + wav2vec2 forced alignment for accurate
# word-level timestamps) and falls back to faster-whisper's own batched
# pipeline when WhisperX's torch/pyannote stack is not installed.
#   pip install 'clipforge[whisperx]'    # enables the WhisperX path
# The engine actually in use is printed at boot and shown by /api/doctor.
engine = "auto"

# auto | cpu | cuda  (auto picks CUDA when torch/ctranslate2 sees a GPU)
device = "auto"
# auto -> int8 on CPU, float16 on GPU. Override only if you know why.
compute_type = "auto"
# Whisper language hint: "auto" detects, or force an ISO code e.g. "en".
# Forcing the language removes a whole class of misdetection failures (short
# clips, music, mixed-speaker audio silently detected as the wrong language,
# which truncates the transcript and quietly wrecks clip boundaries).
# WARNING: a WRONG forced language is worse than "auto" — it does not fall
# back. Set this to the language your sources are actually in.
language = "en"
# 30s windows decoded per batched pass (WhisperX's default is 8).
# Lower it if the host is RAM-constrained; raise it on a big GPU.
batch_size = 8

[gemini]
# FALLBACK detection model. Kept wired so the provider can be switched in the
# dashboard without a redeploy when the Groq quota is exhausted.
# GEMINI_API_KEY comes from .env.
# Model names rot: Google retires old ones with a 404 naming the replacement —
# the backend parses that error and self-heals to the recommended model.
model = "gemini-3.6-flash"
min_clip_sec = 15
max_clip_sec = 60
# Clip count follows the source length, not a fixed number (see app/clipcount.py):
#   under 10 min -> 5-8, 10-25 min -> 10-15, 25-60 min -> 15-25, 60+ min -> 25-40
# This is a CEILING. Candidates scoring below `min_score` are dropped rather
# than padding the batch out to it, so a long but unremarkable source returns
# fewer clips instead of twenty-five mediocre ones. Set auto_clip_count = false
# to use max_clips as a flat number again.
auto_clip_count = true
# Hard ceiling on the scaled count, and the flat count when auto is off (1-40).
max_clips = 40
# 0-100. Below this a candidate is not a highlight. Raise it to get shorter,
# sharper batches; lower it only if the batch comes back with too few clips.
min_score = 60
# 429 backoff retries before giving up (free tier = 15 RPM).
max_retries = 3

[groq]
# DEFAULT detection model. Groq speaks the OpenAI chat-completions wire format,
# so this is a plain HTTP POST with an Authorization: Bearer header.
# GROQ_API_KEY comes from the Keys/API keys tab (console.groq.com/keys).
#
# Verify this is still a current model before relying on it — Groq deprecates
# models and the app will NOT guess a replacement for you; it fails loudly with
# the exact API error so you can pick one from console.groq.com/docs/models.
#
# Do NOT switch this to another model just to dodge a spent daily quota.
# Measured 2026-09-27: qwen/qwen3.8-27b has its own tokens-per-day bucket, but
# caps input at 7,000 tokens/MINUTE, and a 120s detection chunk is ~2,500 input
# tokens — so a single chunk collides with the previous call and is rejected
# with 413. Shrinking chunk_words to fit would change every chunk boundary and
# invalidate the per-chunk cache, re-billing the whole source. Spent quota is
# cheaper than re-scored quota. Wait for the rolling 24h window instead.
model = "openai/gpt-oss-120b"
# Overridable with GROQ_BASE_URL (used by the test suite to point at a local
# OpenAI-compatible stub instead of the real API).
base_url = "https://api.groq.com/openai/v1"
# 429 backoff retries before giving up.
max_retries = 3
# Per-call HTTP ceiling. Detection chunks are ~120s of transcript each.
timeout_sec = 120
# FREE TIER IS ~30 REQUESTS/MINUTE. Calls are paced against this floor
# process-wide so a long transcript (a 2h video is ~60 chunks) never bursts
# into the limit; 429s are still retried, with Retry-After honoured.
# 2.1s => ~28 rpm, just under the ceiling.
min_interval_sec = 2.1
# ---------------------------------------------------------------------------
# JSON CONTRACT — the settings that fix the `json_validate_failed` job death.
# Defaults chosen from tools/detect_json_bench.py over real transcripts
# (8,109-word / 54-min source + two shorter ones), 10 runs per chunk per config.
# ---------------------------------------------------------------------------
# Detection is EXTRACTION, not writing: the model copies word indices out of a
# transcript. There is no creativity to sample, and every degree of temperature
# is another chance to emit a body that fails validation. Benchmark: 0.0 had the
# lowest error rate of 0.0 / 0.3 / 0.7 at equal clip quality.
temperature = 0.0
# "json_schema" (strict, constrained decoding) beat "json_object" and "plain" on
# error rate by a wide margin, and it is the only mode that removes the original
# bug rather than retrying around it. The prompt asks for a top-level ARRAY;
# "json_object" demands a top-level OBJECT. With both instructions in play the
# model failed validation NON-deterministically — the same config returned 200
# and 400 on consecutive calls against the live API. Strict schema makes the
# shape a property of the decoder, so it cannot be violated.
#   "json_object" — weaker, for a model with no Structured Outputs support
#   "plain"       — no response_format at all; the reply is repaired locally
response_format = "json_schema"
# Output budget per call. Truncation at the token ceiling is the most common
# real-world cause of a malformed reply, so the retry ladder raises this on each
# JSON attempt rather than re-asking for the same truncated budget.
max_tokens = 3200
# Hard ceiling for that ladder. Never exceeded, however long a chunk takes.
max_tokens_ceiling = 8192
# Attempts per chunk on a JSON-validation failure, each at lower temperature and
# a higher max_tokens. Capped at 3: a model that cannot produce valid JSON for
# this chunk will not manage it on the fourth try, and each attempt is billed
# against a 200k/day budget.
json_retries = 3
# Ceiling for the ladder's temperature. Each JSON retry uses
# min(temperature, json_retry_temperature), i.e. it can only go DOWN: with the
# 0.0 default above, retries are deterministic too. Raise this only if you also
# raise the base temperature and want a retry to reintroduce some variety.
json_retry_temperature = 0.2
# Tried in order when the primary model still cannot produce valid JSON after
# the whole ladder. All three support strict json_schema (Groq docs), so a
# fallback is a genuine model change rather than a degraded mode.
# NOTE: a fallback is for MALFORMED OUTPUT, not for a spent quota. Switching
# models does not dodge the daily token limit (see the note above on model) —
# it is a different, per-model budget.
fallback_models = ["openai/gpt-oss-20b", "qwen/qwen3.8-27b"]
# Free-tier tokens-per-DAY ceiling. This is only the DENOMINATOR shown by the
# dashboard's usage badge and used when Groq has not yet told us the real limit.
# The authoritative number arrives in a 429 body ("Limit 200000, Used 198530...")
# and overrides this for the day. Raise it on a paid tier.
daily_token_limit = 200000

[deepseek]
# PRIMARY detection backend: the DeepSeek platform (platform.deepseek.com).
# Keys there are `sk-...`, distinct from NVIDIA's `nvapi-...` — this section
# talks to DeepSeek's own API and is billed against your DeepSeek balance.
# It is OpenAI-compatible, so it reuses the same /chat/completions call path
# as Groq and NIM; endpoint, model and rate budget are the only differences.
# DEEPSEEK_API_KEY comes from the Keys/API keys tab.
#
# Why primary: Groq's free tier enforces a hard tokens-per-DAY ceiling PER MODEL
# (200k, rolling 24h). A 54-minute source spends ~87k detecting and a 2-hour
# source blows through the whole day's budget part way through, which used to
# end the job at "chunk 3/7, retrying". DeepSeek bills a balance instead of a
# fixed daily wall, so the primary no longer dies on a quota that is invisible
# until it is gone.
model = "deepseek-flash"
# NOT `https://api.deepseek.com/v1`. DeepSeek documents the OpenAI-compatible
# base WITHOUT `/v1` (both are accepted today), and this transport appends
# `/chat/completions` itself — so `/v1` here would produce a doubled path.
# Overridable with DEEPSEEK_BASE_URL (used by the test suite to point at a
# local OpenAI-compatible stub instead of the real API).
base_url = "https://api.deepseek.com"
max_retries = 3
timeout_sec = 180
# 0.0 disables the per-request floor. Groq NEEDS 2.1s (its free tier is ~30
# rpm); DeepSeek's ceiling is a 2500-request CONCURRENCY limit, so pacing a
# 20-chunk run at 2.1s would cost 40 seconds of wall time for nothing.
min_interval_sec = 0.0
# THE ONE SETTING THAT IS NOT OBVIOUS. DeepSeek's thinking mode is ON by
# default at high effort, and while it is on it IGNORES temperature (plus
# presence/frequency penalty) — the docs say such parameters "will not trigger
# an error but will also have no effect". It also returns the chain-of-thought
# in `reasoning_content`, which is billed as OUTPUT tokens. So with thinking
# left on, the temperature = 0.0 below (and the whole JSON-retry ladder built
# on it) would be decorative, and every retry would pay for reasoning we then
# throw away. "disabled" turns it off so temperature actually applies.
# "enabled" is a valid choice for genuinely hard reasoning passes, just not
# for deterministic transcript extraction.
thinking_mode = "disabled"
# Detection is EXTRACTION (copying word indices out of a transcript), so the
# same reasoning as [groq] applies: no creativity to sample, and every degree
# of temperature is another chance to emit a body that fails validation.
temperature = 0.0
# "json_object", NOT "json_schema". DeepSeek supports JSON Output in the
# OpenAI mode; strict Structured Outputs are a Groq feature. A `json_object`
# prompt MUST also contain the word "json" — `_groq_envelope_prompt` asks for
# a JSON object explicitly, so the contract holds on every rung of the ladder.
response_format = "json_object"
# Output budget per call, and the ceiling the JSON-retry ladder grows towards.
# Truncation at the token ceiling is the usual real cause of a malformed
# reply, so each ladder step raises this rather than re-asking for the same
# truncated budget. DeepSeek's own max output is 384k, so this is a
# clip-extraction budget, not a platform limit.
max_tokens = 3200
max_tokens_ceiling = 8192
# Attempts per chunk on a JSON-validation failure, each at lower temperature
# and a higher max_tokens. Same reasoning and same cap as [groq].
json_retries = 3
json_retry_temperature = 0.2
# Tried in order when the primary model still cannot produce valid JSON after
# the whole ladder. `deepseek-v4-pro` is the other current model; a wrong name
# here would add a hard 404 to every chunk's ladder, so leave it empty unless
# you have verified it.
fallback_models = []
# Self-imposed tokens-per-minute share — a burst guard, not survival pacing.
# DeepSeek's documented limit is a concurrency ceiling (2500 for flash, 500
# for pro), not a tokens/minute one, so this is generous by design; 0 would
# leave only the request floor.
tokens_per_min = 120000
# ONLY the denominator the usage badge divides by. DeepSeek bills a balance
# and sends no daily-token limit in a 429 body, so there is no authoritative
# number to learn — this is whatever daily spend you intend to allow. Pricing
# is far below the hosted alternatives: ~$0.15/1M input and ~$0.60/1M output
# off-peak, doubling during the UTC peak windows (01:00-04:00, 06:00-10:00 on
# weekdays). See api-docs.deepseek.com/quick_start/pricing.
daily_token_limit = 2000000

[nvidia]
# ALTERNATIVE detection backend: NVIDIA NIM (build.nvidia.com) is
# OpenAI-compatible and speaks the same /chat/completions dialect, so it reuses
# that whole call path — endpoint, model and rate budget are the only
# differences. NVIDIA_API_KEY comes from the Keys/API keys tab.
#
# Kept fully wired, not deprecated: NIM hosts its own `deepseek-*` models, but
# those are a DIFFERENT thing from the [deepseek] section above and are billed
# against an NVIDIA quota rather than a DeepSeek balance. Pick this section when
# you have an `nvapi-...` key and no DeepSeek balance.
#
# The `deepseek-*` name below is an NVIDIA-hosted model, not the DeepSeek
# platform. Swap it if NVIDIA rotates the catalog.
model = "deepseek-ai/deepseek-v4.1-flash"
# Overridable with NVIDIA_BASE_URL (used by the test suite to point at a local
# OpenAI-compatible stub instead of the real API).
base_url = "https://integrate.api.nvidia.com/v1"
max_retries = 3
timeout_sec = 120
# 0.0 disables the per-request floor. Groq NEEDS 2.1s (its free tier is ~30
# rpm); NIM's limits are far higher and pacing a 20-chunk run at 2.1s would
# cost 40 seconds of wall time for nothing. The token pacer below still applies.
min_interval_sec = 0.0
# Detection is EXTRACTION (copying word indices out of a transcript), so the
# same reasoning as [groq] applies: no creativity to sample, and every degree
# of temperature is another chance to emit a body that fails validation.
temperature = 0.0
# "json_object", NOT "json_schema". Strict Structured Outputs are a Groq
# feature; NIM's compatibility layer does not promise them, and asking for a
# mode the model cannot do earns a permanent 400 rather than valid JSON. The
# JSON ladder detects that rejection and retries with no response_format,
# repairing the reply locally — so "json_schema" is still safe to select if
# your NIM account does support it.
response_format = "json_object"
# Output budget per call, and the ceiling the JSON-retry ladder grows towards.
# Truncation at the token ceiling is the usual real cause of a malformed
# reply, so each ladder step raises this rather than re-asking for the same
# truncated budget.
max_tokens = 3200
max_tokens_ceiling = 8192
# Attempts per chunk on a JSON-validation failure, each at lower temperature
# and a higher max_tokens. Same reasoning and same cap as [groq].
json_retries = 3
json_retry_temperature = 0.2
# Deliberately EMPTY. NIM's catalog rotates and a wrong name here would add a
# hard 404 to every chunk's ladder; fill it in from build.nvidia.com if you
# know the model you want second.
fallback_models = []
# Self-imposed tokens-per-minute share. NIM rate-limits per model/account in
# requests per minute rather than a small daily token wall, so this is a burst
# guard, not survival pacing. 0 disables it and leaves only the request floor.
tokens_per_min = 120000
# ONLY the denominator the usage badge divides by. NIM reports CREDITS, not a
# per-model daily token ceiling, and — unlike Groq — there is no 429 body that
# overrides this with the provider's real number. Set it to whatever daily
# budget you actually intend to spend.
daily_token_limit = 2000000

[llm]
# Which backend runs AI clip/highlight DETECTION — NOT transcription.
# Transcription is always faster-whisper (see [whisper] above); this choice
# never changes the ASR engine.
##   deepseek (default) — hosted, OpenAI-compatible, PRIMARY. Billed against a
#                      balance rather than a fixed daily token wall like Groq's,
#                      so a long source cannot die half way through detection.
#                      Needs DEEPSEEK_API_KEY.
#   nvidia            — hosted alternative on the same code path. NIM hosts its
#                      own `deepseek-*` models, but on an NVIDIA quota, not a
#                      DeepSeek balance. Needs NVIDIA_API_KEY.
#   groq              — hosted BACKUP. Same wire format, same code path. ~30
#                      req/min and a 200k/day ceiling on the free tier, so calls
#                      are paced client-side. Needs GROQ_API_KEY.
#   gemini           — hosted alternative, selectable without a redeploy.
#                      Needs GEMINI_API_KEY.
#   ollama           — self-hosted. Free and fully private (the transcript
#                      never leaves the machine) and needs no API key, but it
#                      shares the SAME CPU as Whisper, so detection runs
#                      sequentially after the transcript exists and is markedly
#                      slower. Requires `ollama serve` + the model pulled.
#
# There is NO automatic failover between these UNLESS fallback_provider is set
# below: a quota error fails the stage loudly rather than silently scoring clips
# with a model you did not pick.
#
# Env overrides: CLIPFORGE_LLM_PROVIDER, OLLAMA_URL, OLLAMA_MODEL,
#                GROQ_MODEL, GROQ_BASE_URL, NVIDIA_MODEL, NVIDIA_BASE_URL,
#                DEEPSEEK_MODEL, DEEPSEEK_BASE_URL.
# The dashboard shows the active backend and its tradeoff, and can switch it.
#
# Left on deepseek deliberately. NVIDIA NIM was tried here on2026-10-03 as a
# faster, credit-metered alternative (same wire format, same code path) because
# the DeepSeek balance on this account returns "Insufficient Balance" (HTTP
# 402) on every chunk, sending every job to the Groq backup at its conservative
# 6000 tokens/min free-tier pacer. It was reverted: the platform's Keys tab does
# not actually deliver values to the backend, so switching provider only moved
# the "no key" banner rather than fixing anything, and cost the operator
# another account to sign up for. Detection keeps working through the Groq
# fallback on the key already held. Set provider = "nvidia" here AND save
# NVIDIA_API_KEY through the dashboard's "Set key" button if the faster pacer is
# ever wanted again.
provider = "deepseek"

# Automatic failover: when a chunk FAILS on the primary (quota spent, endpoint
# down, key rejected), retry that chunk on the backup before skipping it. Blank
# disables this. Every swap is logged with the provider name, so the provenance
# of a clip is never a surprise.
fallback_provider = "groq"

# Only read when provider = "ollama".
ollama_url = "http://127.0.0.1:11434"
ollama_model = "llama3.1:8b"
# Keep the model resident between chunks (detection runs many calls per job).
ollama_keep_alive = "30m"
# Per-call ceiling. Local models on a busy CPU are slow; a 2h transcript is
# ~60 chunks, so this must exceed a single slow generation comfortably.
ollama_timeout_sec = 600

[translate]
# Multi-language caption tracks, written as sidecar files next to each clip:
#   outputs/<job>/clip01_fr.srt / clip01_fr.vtt ...
#
# These are SEPARATE from the burned-in ASS captions above — the ASS path
# styles on-screen text, this path exports downloadable subtitle tracks.
#
# Translation reuses the [llm] provider (gemini or ollama), so enabling this
# needs no new dependency and no extra API key. Note: Whisper's built-in
# translate task is NOT used — it only targets English, so it cannot produce
# the non-English tracks below.
#
# Off by default: it adds one LLM call per language per batch of cues.
# ON: each clip also gets sidecar SRT/VTT tracks per language, downloadable
# from the clip card. "en" is the source track and is copied straight from the
# transcript, never machine-translated, so it costs nothing.
#
# Cost is the whole trade-off: 11 extra languages x one call per 30 cues x one
# batch per clip. A 13-clip job is ~143 calls. Trim `languages` to what you
# actually publish on — ["en", "es", "fr"] is a fraction of the full list.
enabled = true

# Target languages, emitted in this order. "en" is the source/original track
# and is written straight from the transcript, never machine-translated.
# Supported: en fr es pt de ru it ja ko zh ar hi
languages = ["en", "es", "fr", "pt", "de", "it", "ru", "ar", "hi", "zh", "ja", "ko"]

# Brand / product / speaker names that must survive translation verbatim.
# A term is only checked when it actually appears in the source line, and any
# miss is logged rather than silently rewritten, so drift is visible.
# Example: glossary = ["ClipForge", "OpenAI"]
glossary = []

# Cues per translation request. Batched so the model sees dialogue context;
# bounded so one malformed reply costs a batch rather than the whole job.
batch_size = 30

# Max lines per cue on screen. Line WIDTH is per-language and built in (42 for
# Latin/Cyrillic, 40 for Arabic/Devanagari, 18 for full-width CJK) — a single
# global number would overflow badly in CJK.
max_lines = 2

# Emit both sidecar formats. Drop one to halve the files written.
formats = ["srt", "vtt"]


[subtitle]
# ASS style: bold white with thick neon-green outline, word pop-in.
font = "Arial Black"
# Fallback list when the primary font is not installed (Linux etc.)
font_fallbacks = ["DejaVu Sans", "Arial", "Liberation Sans", "Verdana"]
# Font size in ASS PlayRes units (PlayResY = 1920). ~60-80 reads well on phone.
font_size = 68
# Neon green outline, matching the reference style.
outline_color = "#39FF14"
outline_width = 5
# --- caption bursts ---------------------------------------------------------
# How many words a caption shows at once. A burst also ends early on a pause
# below, so the real range is 1..words_per_cue_max: fast speech gives 3-4 word
# bursts, hesitant speech gives 1-2. Short bursts are what makes captions
# readable on a 9:16 phone.
words_per_cue = 3
# Hard cap per burst. words_per_cue cannot exceed this.
words_per_cue_max = 4
# A gap of at least this many seconds before the next word ends the burst, so
# the boundaries land where the speaker actually pauses instead of every N
# words. Raise it for captions that hold together across short breaths.
pause_sec = 0.30
# Colour the word being spoken is painted in. Leave empty to keep the preset's
# own accent (Bold pop = neon green, Lower-third = white). Overridable from
# the dashboard's "Caption style" dialog, which stores its choice in
# data/caption_style.json and takes effect on the next render — these file
# values are the fallback, so clearing the override comes back here.
highlight_color = ""
# Remove unambiguous vocal fillers ("um", "uh", "hmm") and adjacent stutters
# ("the the") from the DISPLAYED captions only. The audio is never modified —
# a clip is a straight cut of the source, so cutting a spoken "um" out of the
# soundtrack would pull every later word out of sync with the lips. The stored
# transcript keeps every word.
strip_fillers = true
strip_stutters = true
# Vertical anchor as a fraction of frame height (lower third).
position_y = 0.78
# Pop/scale animation on each word group.
pop_animation = true
# Default caption style preset: bold_pop | karaoke | lower_third | boxed
# (per-job override: pick a style on the dashboard form)
preset = "bold_pop"
# --- unclear speech -------------------------------------------------------
# Whisper reports its own confidence per word. A caption cue whose MEAN
# confidence falls below `low_confidence` is rendered as "[muttering]" instead
# of the guess, and below `inaudible_below` as "[inaudible]" — a wrong caption
# burned into a video is worse than an admitted gap, because the viewer reads
# it as fact and it cannot be corrected after posting.
#
# 0.45 is measured, not guessed: on a clean single talker the median cue scored
# 0.87 (only the genuinely truncated lines fell under it), while a
# music/rap/overlap clip scored 0.66 with its garbled stretch at 0.16-0.44.
#
# Raise it to blank fewer lines (0.55 flags only near-nonsense); lower it to
# flag more (0.35 is aggressive). Set low_confidence = 0 to turn the behaviour
# off and always show the transcription.
low_confidence = 0.45
# Must stay BELOW low_confidence — a mis-ordered pair is a config error, not a
# silently disabled tier.
inaudible_below = 0.30

[video]
width = 1080
height = 1920
fps = 30
# x264 quality (lower = better). 20 is visually clean for clips.
crf = 20
# x264 preset. This is the SOFTWARE path: when a hardware encoder is detected
# (NVENC/VAAPI/QSV) the render is offloaded and this value is kept as-is.
# On a CPU-only host the preset is automatically lowered to `ultrafast`
# (app/encode.py) because a 9:16 software encode runs at ~0.1x realtime on one
# vCPU. Set this lower to trade quality for speed, or higher for smaller files.
preset = "veryfast"
# Follow the active speaker with MediaPipe when installed; center crop otherwise.
reframe = true
# Trim dead air with Silero VAD when installed; keep original pacing otherwise.
silence_trim = true

[download]
# 720p is the source ceiling, not the output size. Every clip is re-framed to
# 1080x1920 and re-encoded from the cropped region, so a 1080p source only
# costs download time and bytes that the crop mostly throws away: the reframe
# keeps a ~607px-wide slice of the source, which 720p still has. Raise to 1080
# only if you are clipping sources that are already vertical, where the full
# width is used.
max_height = 720
# Leave "" for none. Set to "chrome"/"firefox"/"edge"/"brave"/"safari" to borrow
# that browser's cookies for age-restricted videos you can access.
cookies_from_browser = ""
# Auto `pip install -U yt-dlp` once on failure before the retry.
auto_update = true

[hosted]
# Hosted-deployment guardrails. Env overrides: CLIPFORGE_MAX_SOURCE_MIN,
# CLIPFORGE_RETENTION_HOURS, WORKER_URL, WORKER_TOKEN, TAILSCALE_ONLY.

# ---- durable media (optional, off until configured) ----------------------
# The sandbox's disk is part of the sandbox: a rebuild brings the codebase back
# and leaves outputs/ and data/ empty. Setting these four values makes uploads
# and finished clips survive that, by pushing them to any S3-compatible bucket
# and pulling them back on demand. Until they are set, nothing about the app
# changes — media simply stays on local disk.
#
#   CLIPFORGE_S3_ENDPOINT     https://<account>.r2.cloudflarestorage.com
#   CLIPFORGE_S3_BUCKET       clipforge-media
#   CLIPFORGE_S3_ACCESS_KEY   …
#   CLIPFORGE_S3_SECRET_KEY   …
#   CLIPFORGE_S3_PREFIX       clipforge      (optional key prefix)
#   CLIPFORGE_S3_REGION       auto           (R2/B2 convention; "auto" works for
#                                             AWS too, so it rarely needs setting)
#   CLIPFORGE_OFFLOAD_DELETE_LOCAL  1        (0 = keep the local copy too)
#
# Cloudflare R2 is the obvious fit: S3-compatible and no egress fees, which
# matters because the same clips are re-served on every playback and download.
# Put the values in the environment (Keys tab), not in this file.

# Sources longer than this are REJECTED at submit time (413). Long sources are
# supported — a 2-hour video transcribes and renders proportionally longer.
max_source_min = 120

# Finished downloads/outputs are deleted this long after a job completes.
# 0 = never auto-delete. This is DESTRUCTIVE: it deletes the finished BATCH
# itself (record + clips + source), not just scratch files.
#
# WAS 0, and that was wrong for a 4 GB sandbox disk. With the sweeper off,
# `data/trash/` alone grew past 350 MB — deleted batches were "recoverable"
# with nothing ever reclaiming them — and every finished job left ~100 MB of
# scratch workspace and a ~300 MB clip set behind forever. Four days is long
# enough to download and share what you made and short enough that the disk
# keeps working.
#
# CLIPFORGE_RETENTION_HOURS overrides this file. Sources you UPLOADED are
# deleted with the batch at this point too; re-upload if you need them again.
# Scratch files (extracted WAVs, per-chunk transcript caches) are cleaned the
# moment a job finishes and do not depend on this setting.
retention_hours = 96

# Largest upload accepted, in megabytes. Rejected at submit time with a 413
# rather than after the bytes are already on disk. 0 = no size limit.
# A 54-minute 720p source is roughly 350 MB, so 4096 comfortably covers the
# long videos this plan accepts while still bounding one job's footprint on a
# 4 GB disk that also holds every rendered clip.
max_source_mb = 4096

# Remote worker dispatch (Tailscale mode B): when set, e.g.
#   WORKER_URL = "http://100.101.102.103:8765"
# the server uploads the source to your home worker-agent and the heavy
# pipeline runs on your machine. Empty = pipeline runs on the server.
worker_url = ""

# Shared secret the worker-agent must present on /api/internal/* endpoints.
worker_token = ""

# Tailscale mode A: when true, the API answers ONLY tailnet/loopback clients
# (401 for the public internet). Use with `tailscale serve` on the host.
tailscale_only = false

# How many queued jobs run in parallel. Every job runs in its own child
# process, so concurrency both drains the queue faster and guarantees one hung
# job cannot stall the jobs behind it. Each parallel transcription holds its
# own model in RAM (~1.5GB each for medium int8) — lower this on a small host.
worker_concurrency = 2

[social]
# "Post to..." — entirely optional and additive. Every platform needs its own
# OAuth app, and the approval effort is NOT the same for each, so each one
# degrades to the download/share-sheet path until it is usable. A missing
# credential here disables that one platform and nothing else.
#
# Full matrix of what each platform requires (see app/social/__init__.py for
# the same table the UI renders):
#   youtube   — no approval. Google Cloud project + OAuth client. ~6 Shorts/day
#               on the default 10,000 unit/day quota (1,600 units each).
#   x         — needs a BILLING-enabled developer account (pay-per-use since 2025).
#   tiktok    — works, but an unaudited app can only post PRIVATE (SELF_ONLY) and
#               is capped at 5 users per rolling 24h.
#   instagram — needs Meta App Review for instagram_content_publish (days–weeks).
#
# Credentials come from the environment (the platform's Environment vars UI),
# not from this file, so they are never written to the repo:
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET
#   X_CLIENT_ID / X_CLIENT_SECRET
#   TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET
#   META_APP_ID / META_APP_SECRET
#   TIKTOK_APP_AUDITED=true   (only after passing the Direct Post audit)
#   CLIPFORGE_PUBLIC_URL       (must match the redirect URI registered with each
#                              provider; used to build /api/social/<p>/callback)

# Where the provider sends the user back to. Must match the redirect URI
# registered with Google / X / TikTok / Meta exactly.
public_url = "http://127.0.0.1:5173"

# Per-request ceiling for a video upload. A 50s clip on a slow link can take a
# while; this is a backstop, not a target.
request_timeout_sec = 180

# Chunk size for the resumable uploads X and TikTok require for video.
upload_chunk_bytes = 4194304
