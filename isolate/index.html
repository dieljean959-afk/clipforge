<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipmake</title>
  <style>
    /* Inline and dependency-free on purpose: if the module graph fails to
       load, the stylesheet never arrives either, so this is the only thing
       that can render. Dark to match the app, so a failed boot does not flash
       a white screen. */
    html, body { margin: 0; background: #0a0a0b; color: #e7e7e9; }
    #boot {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    #boot .card {
      max-width: 34rem; width: 100%; text-align: center;
      border: 1px solid #27272a; border-radius: 12px;
      background: #111113; padding: 28px 22px;
    }
    #boot .title { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    #boot .sub { margin: 0; font-size: 13px; line-height: 1.6; color: #a1a1aa; }
    #boot .err {
      margin: 14px 0 0; padding: 10px; border-radius: 8px;
      background: #1c1917; border: 1px solid #44403c; color: #fca5a5;
      font-family: ui-monospace, monospace; font-size: 11px;
      text-align: left; white-space: pre-wrap; word-break: break-word;
      max-height: 40vh; overflow: auto;
    }
    #boot button {
      margin-top: 18px; cursor: pointer; border: 0; border-radius: 8px;
      background: #22c55e; color: #052e16; font-weight: 700;
      font-size: 13px; padding: 10px 18px;
    }
    #boot button.ghost {
      background: transparent; color: #a1a1aa; border: 1px solid #3f3f46;
      margin-left: 8px; font-weight: 600;
    }
    #boot .actions { display: flex; gap: 0; justify-content: center; flex-wrap: wrap; }
    #boot .status {
      margin: 14px 0 0; font-size: 11px; letter-spacing: .04em;
      text-transform: uppercase; color: #71717a; min-height: 14px;
    }
    #boot .spin {
      display: inline-block; width: 13px; height: 13px; margin-right: 8px;
      vertical-align: -2px; border: 2px solid #3f3f46; border-top-color: #22c55e;
      border-radius: 50%; animation: bootspin 0.8s linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }
    /* Once a failure is known, stop implying that progress is happening. */
    #boot.failed .spin { display: none; }
    /* An INDETERMINATE bar, on purpose.
       This used to be a determinate one driven by
         Math.min(97, Math.round((loaded / EXPECTED_MODULES) * 100))
       which is worse than no bar at all: the total was a guess, and once the
       count passed it the bar pinned at exactly 97% — a ceiling, not a
       reading — for the rest of the boot. On this host that is a median of 7
       seconds and a p90 of 40, so the preview showed a frozen 97% on every
       single load and read as a hang. A sweeping bar cannot be mistaken for a
       stall, and the status line underneath reports facts that keep changing
       (files, megabytes, seconds) instead of a number that cannot move. */
    #boot .meter {
      margin-top: 14px; height: 4px; border-radius: 999px;
      background: #27272a; overflow: hidden;
    }
    #boot .meter > i {
      display: block; height: 100%; width: 34%;
      background: linear-gradient(90deg, #15803d, #4ade80, #15803d);
      animation: bootbar 1.1s ease-in-out infinite;
    }
    @keyframes bootbar {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(295%); }
    }
    /* A dead bar should not keep pretending to work. */
    #boot.failed .meter { display: none; }
  </style>
  <script type="module" crossorigin src="/assets/index-Cv2npoh0.js"></script>
</head>

<body>
  <div id="root"></div>

  <!--
    Boot fallback. `#root` is empty until React mounts, so ANY failure before
    that point — a module that 404s, a stale Vite dep chunk, a syntax error in
    a lazily-imported route — used to leave the page pure white with no
    information at all. This renders first, is removed by main.tsx once the
    app actually mounts, and turns that dead white screen into something that
    says what is happening.

    The important rule here is that a SLOW LOAD IS NOT A FAILURE. In dev the
    browser fetches hundreds of separate modules over HTTP/1.1, and the first
    paint of this app is roughly 3 MB across a dozen round trips (a 1 MB
    react-dom chunk, a 1 MB integrations bundle, 460 KB of react-router, 186 KB
    of CSS). On a phone that legitimately takes longer than any short timeout.

    The previous version declared failure at 15s and then reloaded 30 times at
    5s intervals. Every reload threw away the modules already downloaded and
    started the same 3 MB again, so on a slow connection it could NEVER finish —
    a self-inflicted reload storm that made the preview unreachable. It now:
      - counts resources as they arrive and reports real numbers,
      - never reloads while progress is still happening,
      - never auto-reloads on a mount timeout at all (a reload cannot make a
        slow connection faster — it only restarts the download),
      - auto-retries only for a genuine module-load failure, where a fresh
        fetch genuinely can help, and only 8 times.
  -->
  <div id="boot">
    <div class="card">
      <p class="title"><span class="spin"></span><span id="boot-title">Starting Clipmake…</span></p>
      <p class="sub" id="boot-sub">Loading the app.</p>
      <div class="meter" id="boot-meter" hidden><i></i></div>
      <pre class="err" id="boot-err" hidden></pre>
      <p class="status" id="boot-status"></p>
      <div class="actions" hidden id="boot-actions">
        <button id="boot-reload">Reload now</button>
        <button class="ghost" id="boot-stop">Stop auto-retry</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ---------------------------------------------------------------
      // Clipmake boot loader.
      //
      // Rule 1: a SLOW load is not a failure. The app is ~3 MB across a lot of
      // separate requests on cold start; a phone legitimately takes longer than
      // any short timeout. This loader reports real monotonic progress and only
      // ever reloads for a GENUINE fetch/eval failure, never for "nothing new
      // arrived for a while".
      //
      // Rule 2: retry the FAILED resource, not the whole page. Reloading a
      // module-only failure discards every chunk already downloaded and starts
      // the same multi-MB download over from zero. We retry the one failing URL
      // inline with exponential backoff and a hard cap, and only reload the
      // whole page if even that gives up.
      //
      // Rule 3: a loop guard stops this script from participating in a reload
      // storm. Reload-attempt timestamps are kept in sessionStorage (not
      // localStorage — this is a transient boot problem, not user data). If the
      // app has done more than 2 reloads in 30s, we stop auto-reloading, clear
      // the service worker + shell caches, and show a real error screen with a
      // manual "Clear cache and reload" button. Only a user-initiated action can
      // get past that gate.
      // ---------------------------------------------------------------

      window.__clipmakeBooted = false;

      var BUILD_VERSION = "1.0.0";
      var CACHE_NAMESPACE = "clipmake-shell-";
      var CACHE_NAME = CACHE_NAMESPACE + BUILD_VERSION;

      // Reload-loop guard (session-only).
      var LOOP_KEY = "clipmake.bootLoop";
      var LOOP_WINDOW_SECONDS = 30;
      var LOOP_MAX_RELOADS = 2;

      // Per-file retry policy for module/script load failures.
      // We retry the SINGLE failing URL, not the whole page.
      var PER_FILE_MAX_ATTEMPTS = 3;
      var PER_FILE_BASE_MS = 800;
      var PER_FILE_CAP_MS = 8000;

      // Absolute ceiling for the whole boot. After this we stop even trying and
      // surface the real last-known failure instead of hammering the network.
      var HARD_CEILING_MS = 180000; // 3 min

      var startedAt = Date.now();
      var files = 0;
      var bytes = 0;
      var lastProgressAt = Date.now();
      var reloads = 0;
      var failed = false;
      var programmaticReloadInFlight = false;
      var timer = null;
      var perFileTimers = [];

      // Controlled log, structured and timestamped. Keeping it on one object so
      // the error screen can dump it as one JSON blob.
      var bootLog = [];
      function log(type, message, detail) {
        var entry = {
          t: Date.now() - startedAt,
          type: type,
          message: message,
        };
        if (detail != null) entry.detail = detail;
        bootLog.push(entry);
        try {
          if (window.__clipmakeBootLogs) window.__clipmakeBootLogs.push(entry);
        } catch (e) { /* ignore */ }
        if (type === "error" || type === "loop-stop" || type === "reload") {
          console.warn("[clipmake/boot] " + type + ": " + message + (detail != null ? " (" + JSON.stringify(detail) + ")" : ""));
        }
      }

      function el(id) { return document.getElementById(id); }

      function status(text) {
        var node = el("boot-status");
        if (node) node.textContent = text;
      }

      // Monotonic progress reporter. Nothing here moves backward because the
      // counters only increase.
      function paintStatus(slow) {
        var mbText = bytes > 0 ? " · " + (bytes / 1048576).toFixed(1) + " MB" : "";
        var secs = Math.round((Date.now() - startedAt) / 1000);
        status(
          "Loading… " + files + " files" + mbText + " · " + secs + "s" +
            (slow ? " · slow connection" : ""),
        );
      }

      function noteProgress(entries) {
        if (!entries || !entries.length) return;
        for (var i = 0; i < entries.length; i++) {
          var enc = entries[i].encodedBodySize || 0;
          var trans = entries[i].transferSize || 0;
          files += 1;
          bytes += trans || enc;
        }
        lastProgressAt = Date.now();
        paintStatus(false);
      }

      if (window.PerformanceObserver) {
        try {
          new PerformanceObserver(function (list) {
            noteProgress(list.getEntries());
          }).observe({ type: "resource", buffered: true });
        } catch (e) { /* older browsers: the timer below still copes */ }
      }

      // ---- loop guard ----------------------------------------------------

      function readLoopState() {
        try {
          var raw = sessionStorage.getItem(LOOP_KEY);
          if (!raw) return { version: BUILD_VERSION, reloads: [], aborted: false };
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return { version: BUILD_VERSION, reloads: [], aborted: false };
          // A version jump means the loader changed under a stuck device. Reset
          // the history but keep the aborted flag so we do not silently re-enter
          // a storm on an old session.
          if (parsed.version !== BUILD_VERSION) {
            return { version: BUILD_VERSION, reloads: [], aborted: !!parsed.aborted };
          }
          return parsed;
        } catch (e) {
          return { version: BUILD_VERSION, reloads: [], aborted: false };
        }
      }

      function writeLoopState(state) {
        try { sessionStorage.setItem(LOOP_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
      }

      function loopTryReload() {
        var state = readLoopState();
        if (state.aborted) return false;
        var now = Date.now();
        state.reloads.push(now);
        // Keep only the window we care about.
        state.reloads = state.reloads.filter(function (ts) {
          return now - ts < LOOP_WINDOW_SECONDS * 1000;
        });
        writeLoopState(state);
        if (state.reloads.length > LOOP_MAX_RELOADS) {
          state.aborted = true;
          writeLoopState(state);
          return false;
        }
        return true;
      }

      function loopStop(reason) {
        var state = readLoopState();
        state.aborted = true;
        writeLoopState(state);
        return state;
      }

      function clearShellCachesAndWorker() {
        log("action", "clearing shell caches + service worker");
        if (window.caches) {
          Promise.all([
            caches.keys().then(function (names) {
              return Promise.all(
                names
                  .filter(function (n) { return n.indexOf(CACHE_NAMESPACE) === 0 || n === "clipforge-share-v1"; })
                  .map(function (n) { return caches.delete(n); }),
              );
            }),
          ]).catch(function (e) { log("warn", "cache clear failed", e && e.message); });
        }
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function (e) { log("warn", "worker unregister failed", e && e.message); });
          // Best-effort: try to stop the active worker so it stops serving a
          // stale shell on the next load.
          try {
            var active = navigator.serviceWorker.controller;
            if (active) active.postMessage({ type: "CLIPFORGE_CLEAR_SHELL" });
          } catch (e) { /* postMessage may throw on some browsers */ }
        }
      }

      // ---- per-file retry -----------------------------------------------

      function schedulePerFileRetry(url, attempt) {
        attempt = attempt || 1;
        if (attempt > PER_FILE_MAX_ATTEMPTS) {
          log("error", "per-file retry exhausted", { url: url, attempts: attempt - 1 });
          // We tried the one bad resource 3x with backoff. Now a full reload has
          // a real chance of helping (e.g. the bad asset only exists on a newer
          // build). But we still go through the global loop guard.
          failAndRetry("Failed to load " + (url || "a module") + " after " + (attempt - 1) + " retries.");
          return;
        }
        var backoff = Math.min(PER_FILE_CAP_MS, PER_FILE_BASE_MS * Math.pow(2, attempt - 1));
        log("retry", "scheduling per-file retry", { url: url, attempt: attempt, backoffMs: backoff });
        var id = setTimeout(function () {
          // If boot succeeded in the meantime, do not inject another script.
          if (window.__clipmakeBooted) return;
          injectModuleScript(url, attempt + 1);
        }, backoff);
        perFileTimers.push(id);
      }

      function injectModuleScript(url, attempt) {
        if (!url) return;
        var script = document.createElement("script");
        script.type = "module";
        script.src = url;
        script.async = true;
        script.addEventListener("load", function () {
          log("action", "per-file retry succeeded", { url: url, attempt: attempt });
          // The real entry point will still be the one in index.html; this is
          // only for recovering a single failed chunk that the browser would
          // otherwise never request again.
        });
        script.addEventListener("error", function () {
          log("error", "per-file retry failed", { url: url, attempt: attempt });
          schedulePerFileRetry(url, attempt);
        });
        document.head.appendChild(script);
      }

      // ---- global failure path -------------------------------------------

      function hardReload() {
        if (window.__clipmakeBooted) return;
        if (programmaticReloadInFlight) return;
        if (!loopTryReload()) {
          log("loop-stop", "reload loop guard stopped auto-reload", readLoopState());
          stopAllTimers();
          showLoopStoppedError();
          return;
        }
        reloads += 1;
        log("reload", "scheduled full reload", { reloads: reloads, reason: "module/fatal failure" });
        // location.replace keeps us off the reload history so the user does not
        // get trapped in the back-button.
        location.replace(location.pathname + "?reload=" + Date.now());
      }

      function stopAllTimers() {
        if (timer) { clearInterval(timer); timer = null; }
        perFileTimers.forEach(function (id) { clearTimeout(id); });
        perFileTimers = [];
      }

      function failAndRetry(message, failingUrl) {
        if (window.__clipmakeBooted || failed) return;
        failed = true;
        log("error", "boot failure", { message: message, failingUrl: failingUrl });
        var boot = el("boot");
        if (!boot) return;
        boot.classList.add("failed");
        var deadMeter = el("boot-meter");
        if (deadMeter) deadMeter.hidden = true;
        el("boot-title").textContent = "Clipmake didn't start";
        el("boot-sub").textContent =
          "A piece of the app failed to load — often a server restart mid-load, " +
          "a bad connection, or a stale cached version. It will retry the failed " +
          "file first, and only reload the page if that does not help.";
        var errNode = el("boot-err");
        if (errNode) {
          errNode.textContent = "failed file: " + (failingUrl || message) + "\n" + message;
          errNode.hidden = false;
        }
        el("boot-actions").hidden = false;

        // If we already crossed the loop guard, do not start another retry timer.
        if (readLoopState().aborted) {
          status("Stopped retrying — tap Clear cache and reload.");
          return;
        }

        // Start with a per-file retry, not a whole-page reload.
        schedulePerFileRetry(failingUrl, 1);
      }

      function showLoopStoppedError() {
        if (!el("boot")) return;
        var boot = el("boot");
        boot.classList.add("failed");
        var deadMeter = el("boot-meter");
        if (deadMeter) deadMeter.hidden = true;
        el("boot-title").textContent = "Clipmake is stuck loading";
        el("boot-sub").textContent =
          "The app reloaded too many times in a short period, so auto-retry was " +
          "turned off to stop the loop.";
        var errNode = el("boot-err");
        if (errNode) {
          errNode.textContent = bootLog
            .filter(function (e) { return e.type === "error" || e.type === "reload" || e.type === "retry"; })
            .map(function (e) { return "[" + e.t + "s] " + e.message + (e.detail && e.detail.url ? " — " + e.detail.url : ""); })
            .join("\n") || "No detailed failure recorded.";
          errNode.hidden = false;
        }
        el("boot-actions").hidden = false;

        // Replace the two original buttons with a clearer recovery set.
        var actions = el("boot-actions");
        if (actions) {
          actions.innerHTML =
            '<button id="boot-reload">Reload now</button>' +
            '<button class="ghost" id="boot-stop">Stop auto-retry</button>' +
            '<button class="ghost" id="boot-clear">Clear cache and reload</button>';
        }
        el("boot-reload").addEventListener("click", hardReload);
        el("boot-stop").addEventListener("click", function () {
          stopAllTimers();
          loopStop("user");
          status("Auto-retry stopped.");
        });
        var clearBtn = el("boot-clear");
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            clearShellCachesAndWorker();
            loopStop("user");
            stopAllTimers();
            log("action", "user cleared caches and requested reload");
            setTimeout(function () { location.reload(); }, 0);
          });
        }
      }

      // ---- slow-progress watch (never reloads on slow alone) -------------

      function watchProgress() {
        timer = setInterval(function () {
          if (window.__clipmakeBooted) return;
          var now = Date.now();
          var idleFor = now - lastProgressAt;
          var elapsed = now - startedAt;

          paintStatus(elapsed > 6000 && idleFor < 4000);

          if (elapsed > HARD_CEILING_MS && idleFor > 15000) {
            var root = el("root");
            if (root && root.childElementCount > 0) return;
            failed = true;
            log("error", "hard ceiling reached with no mount", { elapsedMs: elapsed, idleMs: idleFor, files: files, bytes: bytes });
            boot.classList.add("failed");
            el("boot-title").textContent = "ClipForge still hasn't loaded";
            el("boot-sub").textContent =
              "This is a slow connection, not a broken app: " + files +
              " files downloaded but the app never finished starting. A reload " +
              "will not help — try a stronger connection, or close other tabs to free up bandwidth.";
            el("boot-err").hidden = true;
            el("boot-actions").hidden = false;
            el("boot-stop").hidden = true;
            status("No auto-reload: reloading would restart the download.");
          }
        }, 1000);
      }

      // ---- wire buttons -------------------------------------------------

      el("boot-reload").addEventListener("click", hardReload);
      el("boot-stop").addEventListener("click", function () {
        stopAllTimers();
        loopStop("user");
        status("Auto-retry stopped.");
      });

      // ---- error capture ------------------------------------------------

      window.addEventListener(
        "error",
        function (e) {
          if (window.__clipmakeBooted) return;
          var target = e && e.target;
          var url = null;
          if (target && target.tagName === "SCRIPT" && target.src) {
            url = target.src;
          }
          // Failing url may already be present on the event for module errors.
          if (!url && e && e.detail && e.detail.filename) url = e.detail.filename;
          log("error", "module/script error", { message: e && e.message, url: url });
          failAndRetry((e && e.message) || ("Failed to load " + (url || "a module")), url);
        },
        true,
      );

      window.addEventListener("unhandledrejection", function (e) {
        if (window.__clipmakeBooted) return;
        var r = e && e.reason;
        var msg = (r && r.message) || (r && r.toString()) || "Unhandled promise rejection";
        log("error", "unhandled rejection", { message: msg });
        failAndRetry(msg);
      });

      // ---- boot ----------------------------------------------------------

      log("boot", "boot loader start", { buildVersion: BUILD_VERSION });
      var meter = el("boot-meter");
      if (meter) meter.hidden = false;
      paintStatus(false);
      watchProgress();
    })();
  </script>

  <!-- The app entry point. Deferring to window.onload keeps the boot loader
       (the inline script above) in charge until proven assets are already
       being fetched, which is what prevents a flash of the old loader path
       during a cold start on a slow connection. -->
  <script>
    (function () {
      // Defer the app entry script so the boot loader (the inline script above)
      // stays in charge until the page is interactive. This avoids a race where
      // the entry module starts loading before the loader is fully wired on very
      // slow connections.
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/src/main.tsx';
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
