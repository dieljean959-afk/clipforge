name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend (core deps only — extras stay optional)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install httpx ruff

      - name: Lint (ruff)
        run: ruff check app tools

      - name: Compile-check every backend module
        run: python tools/compile_check.py

      - name: Config self-check
        run: python -m app.config

      - name: Smoke test (API + worker + honest failure paths)
        run: python tools/smoke_test.py

      - name: E2E render test (real ffmpeg: cut → crop → captions → thumbnail)
        run: python tools/e2e_render_test.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install UI deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc -b --noEmit

      - name: Build dashboard
        run: bun run build
